# Nginx Reverse Proxy Configuration for Taiga MCP Server
# Place in /etc/nginx/sites-available/taiga-mcp.conf and symlink to /etc/nginx/sites-enabled/

upstream taiga_mcp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name taiga-mcp.yourdomain.com; # Change to your domain or server IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is configured)
    # return 301 https://$host$request_uri;

    # Client body size for file attachments / wiki uploads
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. MCP Server-Sent Events (SSE) Endpoint
    # Critical for real-time streaming to MCP clients (Claude Desktop, Cursor, Continue, etc.)
    location /sse {
        proxy_pass http://taiga_mcp_backend/sse;
        proxy_http_version 1.1;

        # Disable buffering to allow immediate event streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keepalive and connection headers
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent SSE connection
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. MCP JSON-RPC Message Receiver & HTTP Endpoints
    location /messages {
        proxy_pass http://taiga_mcp_backend/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Direct MCP HTTP RPC & Streamable HTTP / SSE endpoint
    location /mcp {
        proxy_pass http://taiga_mcp_backend/mcp;
        proxy_http_version 1.1;

        # Disable buffering for real-time Streamable HTTP & SSE standby streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Persistent connection headers
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. Remote Parameterization API & Swagger Testing Endpoints
    location /api/ {
        proxy_pass http://taiga_mcp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Swagger UI Documentation and Interactive Testing
    location /swagger {
        proxy_pass http://taiga_mcp_backend/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://taiga_mcp_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Health check and default route
    location / {
        proxy_pass http://taiga_mcp_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
